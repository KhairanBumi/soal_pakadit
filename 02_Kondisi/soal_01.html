<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 1 - Cek Kelulusan</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .lulus { color: green; font-weight: bold; }
    .tidak-lulus { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Soal 1 - Cek Kelulusan</h1>
  <div id="hasil"></div>
  <script>
    const nilaiUjian = 80;
    const hasil = nilaiUjian >= 75
      ? '<span class="lulus">Selamat, Anda Lulus!</span>'
      : '<span class="tidak-lulus">Maaf, Anda Belum Lulus.</span>';

    document.getElementById("hasil").innerHTML = hasil;
  </script>
</body>
</html>
