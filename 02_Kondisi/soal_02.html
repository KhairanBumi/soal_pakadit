<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 2 - Peringatan Cuaca</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    #peringatan { display: none; padding: 15px; background: #ffe0e0; border: 1px solid #f00; }

</head>
