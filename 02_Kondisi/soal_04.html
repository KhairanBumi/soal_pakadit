<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 4 - Diskon</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .ungu { color: purple; font-weight: bold; }
    .biru { color: blue; font-weight: bold; }
    .abu { color: gray; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Soal 4 - Diskon Keranjang</h1>
  <div id="hasil"></div>
  <script>
    const totalBelanja = 350000;

    const hasil = totalBelanja > 500000
      ? '<span class="ungu">Anda Mendapat Diskon 20%!</span>'
      : totalBelanja >= 200000
        ? '<span class="biru">Anda Mendapat Diskon 10%!</span>'
        : '<span class="abu">Belanja lebih banyak untuk dapat diskon!</span>';

    document.getElementById("hasil").innerHTML = hasil;
  </script>
</body>
</html>
